<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat — Budget Ads</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main">
  <div class="topbar">
    <div class="topbar-title">📋 Riwayat Top Up</div>
    <div style="position:relative;">
      <button class="notif-btn" id="notifBtn" onclick="toggleNotif()">🔔
        <span class="notif-badge" id="notifBadge"></span>
      </button>
      <div class="notif-dropdown" id="notifDropdown">
        <div class="notif-header">Notifikasi
          <button onclick="markAllRead()" style="background:none;border:none;cursor:pointer;font-size:12px;color:#1877F2;">Tandai semua dibaca</button>
        </div>
        <div id="notifList"></div>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- Filter -->
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
        <div style="flex:1;min-width:140px;">
          <label style="font-size:12px;font-weight:600;color:#65676B;margin-bottom:4px;display:block;">Dari Tanggal</label>
          <input type="date" id="filterFrom">
        </div>
        <div style="flex:1;min-width:140px;">
          <label style="font-size:12px;font-weight:600;color:#65676B;margin-bottom:4px;display:block;">Sampai</label>
          <input type="date" id="filterTo">
        </div>
        <div style="flex:1;min-width:120px;" id="akunFilterWrap">
          <label style="font-size:12px;font-weight:600;color:#65676B;margin-bottom:4px;display:block;">Akun</label>
          <select id="filterAkun">
            <option value="">Semua Akun</option>
          </select>
        </div>
        <div style="flex:1;min-width:120px;">
          <label style="font-size:12px;font-weight:600;color:#65676B;margin-bottom:4px;display:block;">Status</label>
          <select id="filterStatus">
            <option value="">Semua Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="loadHistory()">Tampilkan</button>
      </div>
    </div>

    <!-- Summary -->
    <div class="stat-grid" style="margin-bottom:16px;" id="summaryGrid" style="display:none;">
      <div class="stat-card"><div class="stat-label">Total Top Up (ACC)</div><div class="stat-value" id="sumTopup">—</div></div>
      <div class="stat-card"><div class="stat-label">Jumlah Request</div><div class="stat-value" id="sumCount">—</div></div>
      <div class="stat-card"><div class="stat-label">Total Spend (dari SS)</div><div class="stat-value" id="sumSpend">—</div></div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr id="histHead"></tr>
          </thead>
          <tbody id="histBody">
            <tr><td colspan="8" style="text-align:center;padding:32px;color:#65676B;">Pilih rentang tanggal lalu klik Tampilkan</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
  let profile = null;

  async function init() {
    await requireAuth();
    profile = await getProfile();
    await initNav('history');

    // Default filter: 7 hari terakhir
    const today = new Date();
    const week = new Date(today); week.setDate(today.getDate() - 6);
    document.getElementById('filterFrom').value = week.toISOString().split('T')[0];
    document.getElementById('filterTo').value = today.toISOString().split('T')[0];

    await loadAkunFilter();
    await loadHistory();
  }

  async function loadAkunFilter() {
    const isAdmin = profile.role === 'admin';
    let query = supabase.from('akun_ads').select('id, nama_akun, advertiser_id, profiles(nama)').eq('aktif', true);
    if (!isAdmin) query = query.eq('advertiser_id', profile.id);

    const { data } = await query.order('nama_akun');
    const sel = document.getElementById('filterAkun');
    sel.innerHTML = '<option value="">Semua Akun</option>' +
      (data || []).map(a => `<option value="${a.id}">${a.nama_akun}${isAdmin ? ' (' + (a.profiles?.nama || '') + ')' : ''}</option>`).join('');
  }

  async function loadHistory() {
    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;
    const akun = document.getElementById('filterAkun').value;
    const status = document.getElementById('filterStatus').value;
    const isAdmin = profile.role === 'admin';

    let query = supabase
      .from('topup_requests')
      .select('*, akun_ads(nama_akun, produk(nama)), profiles(nama)')
      .order('created_at', { ascending: false });

    if (!isAdmin) query = query.eq('advertiser_id', profile.id);
    if (from) query = query.gte('tanggal', from);
    if (to) query = query.lte('tanggal', to);
    if (akun) query = query.eq('akun_id', akun);
    if (status) query = query.eq('status', status);

    const { data } = await query.limit(200);

    // Summary
    const approved = (data || []).filter(r => r.status === 'approved');
    const totalTopup = approved.reduce((s, r) => s + (r.nominal_actual || 0), 0);
    const totalSpend = (data || []).reduce((s, r) => s + (r.extracted_data?.spend || 0), 0);
    document.getElementById('sumTopup').textContent = formatRp(totalTopup);
    document.getElementById('sumCount').textContent = (data || []).length;
    document.getElementById('sumSpend').textContent = formatRp(totalSpend);
    document.getElementById('summaryGrid').style.display = 'grid';

    // Head
    document.getElementById('histHead').innerHTML = `
      <th>Tanggal</th>
      ${isAdmin ? '<th>Advertiser</th>' : ''}
      <th>Akun / Produk</th>
      <th>Waktu</th>
      <th>Spend (SS)</th>
      <th>Biaya/Hasil</th>
      <th>Nominal ACC</th>
      <th>Status</th>
    `;

    const tbody = document.getElementById('histBody');
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📭</div><p>Tidak ada data</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(r => {
      const ext = r.extracted_data || {};
      return `<tr>
        <td>${formatDate(r.tanggal)}</td>
        ${isAdmin ? `<td>${r.profiles?.nama || '—'}</td>` : ''}
        <td>${r.akun_ads?.nama_akun || '—'}<br><span style="font-size:11px;color:#65676B;">${r.akun_ads?.produk?.nama || ''}</span></td>
        <td><span class="badge badge-${r.tipe}">${r.tipe}</span></td>
        <td>${formatRp(ext.spend)}</td>
        <td>${formatRp(ext.biaya_per_hasil)}</td>
        <td>${r.nominal_actual ? formatRp(r.nominal_actual) : '—'}</td>
        <td>
          <span class="badge badge-${r.status}">${r.status === 'pending' ? 'Menunggu' : r.status === 'approved' ? 'ACC ✓' : 'Ditolak'}</span>
          ${r.catatan ? `<div style="font-size:11px;color:#65676B;margin-top:2px;">${r.catatan}</div>` : ''}
        </td>
      </tr>`;
    }).join('');
  }

  init();
</script>
</body>
</html>
