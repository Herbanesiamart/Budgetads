<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Budget Management Ads</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1877F2 0%, #0d6efd 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .box {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo .icon { font-size: 48px; }
    .logo h1 { font-size: 22px; font-weight: 800; color: #1877F2; margin-top: 8px; }
    .logo p { font-size: 13px; color: #65676B; margin-top: 4px; }

    .tabs {
      display: flex;
      background: #f0f2f5;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #65676B;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: white;
      color: #1877F2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dde1e7;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #1877F2; box-shadow: 0 0 0 3px rgba(24,119,242,0.1); }

    .btn {
      width: 100%;
      padding: 13px;
      background: #1877F2;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .form-tab { display: none; }
    .form-tab.active { display: block; }
  </style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="icon">💰</div>
    <h1>Budget Ads</h1>
    <p>Budget Management Meta Ads</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('login')">Masuk</button>
    <button class="tab-btn" onclick="switchTab('register')">Daftar</button>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <!-- LOGIN -->
  <div id="loginTab" class="form-tab active">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="email@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Masuk</button>
  </div>

  <!-- REGISTER -->
  <div id="registerTab" class="form-tab">
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="regNama" placeholder="Nama kamu">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="email@example.com">
    </div>
    <div class="form-group">
      <label>No. WhatsApp</label>
      <input type="tel" id="regWa" placeholder="628xxxxxxxxx">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPass" placeholder="Min. 6 karakter">
    </div>
    <button class="btn" id="regBtn" onclick="doRegister()">Daftar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script>
  const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

  // Cek sudah login
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'dashboard.html';
  }).catch(() => {});

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', tab === 'login' ? i === 0 : i === 1);
    });
    document.getElementById('loginTab').classList.toggle('active', tab === 'login');
    document.getElementById('registerTab').classList.toggle('active', tab === 'register');
    document.getElementById('errorMsg').style.display = 'none';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!email || !pass) return showError('Isi email dan password.');

    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Masuk...';

    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError('Email atau password salah.');
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  }

  async function doRegister() {
    const nama = document.getElementById('regNama').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const wa = document.getElementById('regWa').value.trim();
    const pass = document.getElementById('regPass').value;

    if (!nama || !email || !pass) return showError('Nama, email, dan password wajib diisi.');
    if (pass.length < 6) return showError('Password minimal 6 karakter.');

    const btn = document.getElementById('regBtn');
    btn.disabled = true; btn.textContent = 'Mendaftar...';

    try {
      const { data, error } = await supabase.auth.signUp({
        email,
        password: pass,
        options: { emailRedirectTo: window.location.origin + '/dashboard.html' }
      });

      if (error) throw error;

      // data.user bisa null jika email confirmation aktif
      const userId = data.user?.id || data.session?.user?.id;
      if (!userId) {
        showError('Cek email kamu untuk konfirmasi akun, lalu login.');
        btn.disabled = false; btn.textContent = 'Daftar';
        return;
      }

      await supabase.from('profiles').insert({ id: userId, nama, no_wa: wa, role: 'advertiser' });
      window.location.href = 'dashboard.html';

    } catch (err) {
      showError(err.message || 'Gagal mendaftar, coba lagi.');
      btn.disabled = false; btn.textContent = 'Daftar';
    }
  }

  // Enter key support
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('loginTab').classList.contains('active')) doLogin();
    else doRegister();
  });
</script>
</body>
</html>
